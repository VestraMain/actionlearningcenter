<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Learning Academy</title>
    <meta
      name="description"
      content="Educación flexible y apoyo personalizado para estudiantes de 9.º a 12.º grado en Aurora, Colorado."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0e2350;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0e2350;
        color: #fff;
      }

      .loader {
        width: min(420px, calc(100% - 48px));
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: #f5b301;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2.3rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 12px 0 0;
        color: #cdd6ea;
        line-height: 1.6;
      }

      .bar {
        height: 7px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }

      .bar span {
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #f5b301;
        animation: loading 1.15s ease-in-out infinite alternate;
      }

      @keyframes loading {
        to {
          transform: translateX(185%);
        }
      }
    </style>
  </head>
  <body>
    <main class="loader" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>Action Learning Academy</h1>
      <p id="status">Preparando el sitio…</p>
      <div class="bar" aria-hidden="true"><span></span></div>
    </main>

    <script>
      (async () => {
        const status = document.getElementById("status");

        try {
          const manifestResponse = await fetch("/site/manifest.json", {
            cache: "no-store",
          });
          if (!manifestResponse.ok) {
            throw new Error("No se pudo cargar el manifiesto del sitio.");
          }

          const { parts } = await manifestResponse.json();
          const chunks = [];

          for (let index = 0; index < parts.length; index += 1) {
            status.textContent = `Preparando el sitio… ${Math.round(
              ((index + 1) / parts.length) * 100,
            )}%`;
            const response = await fetch(`/site/${parts[index]}`);
            if (!response.ok) {
              throw new Error(`No se pudo cargar ${parts[index]}.`);
            }
            chunks.push(await response.text());
          }

          const page = chunks
            .join("")
            .split("Nosotros.dc.html")
            .join("#vida")
            .split("Programa.dc.html")
            .join("#programa")
            .split("Contacto.dc.html")
            .join("#contacto")
            .split('href=\\"#\\"')
            .join('href=\\"#vida\\"')
            .split('href="#"')
            .join('href="#vida"');
          document.open();
          document.write(page);
          document.close();
          const syncTitle = () => {
            if (document.title !== "Action Learning Academy") {
              document.title = "Action Learning Academy";
            }
          };
          new MutationObserver(syncTitle).observe(document, {
            childList: true,
            subtree: true,
          });
          syncTitle();
        } catch (error) {
          console.error(error);
          status.textContent =
            "No pudimos cargar el sitio. Por favor, actualiza la página.";
        }
      })();
    </script>
  </body>
</html>
